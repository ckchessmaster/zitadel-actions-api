# Example oauth2-proxy configuration for protecting Frigate NVR with ZITADEL
#
# Deploy this alongside Frigate or as an Ingress external-auth provider.
# Frigate receives authenticated headers: X-Forwarded-User and X-Forwarded-Groups.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy-frigate
  labels:
    app.kubernetes.io/name: oauth2-proxy-frigate
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oauth2-proxy-frigate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oauth2-proxy-frigate
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.6.0
          args:
            # OIDC Provider settings (points to your ZITADEL instance)
            - --provider=oidc
            - --oidc-issuer-url=https://<your-zitadel-domain>
            - --client-id=<ZITADEL_CLIENT_ID>
            - --client-secret=<ZITADEL_CLIENT_SECRET>
            - --cookie-secret=<RANDOM_32_BYTE_SECRET>

            # Claim extraction: look for the flattened 'groups' claim provided by zitadel-actions-api
            - --oidc-groups-claim=groups
            - --scope=openid profile email

            # Group restriction: require users to have 'frigate-admin' or 'frigate-viewer' role
            - --allowed-group=frigate-admin
            - --allowed-group=frigate-viewer

            # Upstream proxy destination (points to Frigate NVR service in your cluster)
            - --upstream=http://frigate.default.svc.cluster.local:5000

            # Headers to pass downstream to Frigate
            - --set-xauthrequest=true
            - --pass-user-headers=true
            - --pass-access-token=false

            # Listening address
            - --http-address=0.0.0.0:4180
            - --cookie-secure=true
          ports:
            - name: http
              containerPort: 4180
---
apiVersion: v1
kind: Service
metadata:
  name: oauth2-proxy-frigate
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 4180
      targetPort: 4180
  selector:
    app.kubernetes.io/name: oauth2-proxy-frigate
