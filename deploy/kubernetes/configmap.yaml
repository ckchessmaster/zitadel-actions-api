apiVersion: v1
kind: ConfigMap
metadata:
  name: zitadel-actions-api-config
  labels:
    app.kubernetes.io/name: zitadel-actions-api
    app.kubernetes.io/part-of: zitadel
data:
  PORT: "8080"
  LOG_LEVEL: "info"
  CLAIM_NAME: "groups"
  ROLE_FORMAT: "bare"
  LOWERCASE_ROLES: "true"
  FILTER_PROJECT_ID: ""
  # Base URL of your ZITADEL instance (e.g. "https://kingdon.auth.chriskingdon.com" or in-cluster "http://zitadel:8080")
  ZITADEL_API_URL: ""
