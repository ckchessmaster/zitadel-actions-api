apiVersion: v1
kind: Secret
metadata:
  name: zitadel-actions-api-secret
  labels:
    app.kubernetes.io/name: zitadel-actions-api
    app.kubernetes.io/part-of: zitadel
type: Opaque
stringData:
  # Signing key issued by ZITADEL when creating the Action Target (required)
  # Incoming webhooks must include a valid HMAC signature
  ZITADEL_SIGNING_KEY: "your-zitadel-signing-key-here"

  # Optional Service User Personal Access Token (PAT)
  # Used to query ZITADEL Management API for user grants when missing from webhook payload
  ZITADEL_API_TOKEN: "your-zitadel-service-user-pat-here"
